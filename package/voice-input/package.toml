# 语音输入（设计：核心仓库 docs/designs/20-语音.md 第五节）。本机 CPU 识别说的话，在总线上提供 stt；
# 终端、网页的麦克风和 IM 的语音转字都照名字调它（设计 67），不认这个包名。

[package]
version = "0.1.0"
# 带本机程序：一种系统一个包文件（.github/workflows/release.yml）。
targets = ["linux-x86_64", "macos-aarch64", "windows-x86_64"]
protocol = [1, 1]
name = { en = "Voice input", zh = "语音输入", ja = "音声入力" }
summary = { en = "Turns speech into text on this computer: the microphone in the terminal and web, voice messages in chats", zh = "在这台电脑上把说的话转成字：终端、网页的麦克风，聊天里的语音消息", ja = "このコンピューターで話した言葉を文字にします：ターミナルとウェブのマイク、チャットの音声メッセージ" }
upstream = "https://github.com/miyu-agent/miyu-voice"
icon = "mic"
# 配置键是 voice-input.*（同包编号，写明了不随编号变；程序照这个前缀读）。
prefix = "voice-input"

# 扩展必写：miyu voice-input 印模型下好没有、用的哪个麦克风（设计 20 第五节「配置页」的那几样，查问题用）。
[command]
name = "voice-input"
program = "miyu-voice-input"
about = { en = "Voice input: model and microphone status", zh = "语音输入：模型、麦克风的情况", ja = "音声入力：モデルとマイクの状態" }

[process]
args = ["serve"]
start = "always"
# audio.record：录本机麦克风（stt.record）；audio.play：开始、停止听的提示音；network：第一次启动下载识别模型；
# packages.call：调社区的 stt.engine。
capabilities = ["audio.record", "audio.play", "network", "packages.call"]

# 总线（设计 67）：模型下好、校验过才登记这三个方法，头这时才画麦克风（设计 20 第五节）。
[export]
provides = ["stt"]
methods = ["stt.transcribe", "stt.record", "stt.stop"]

# 配置页（设计 20 第五节「配置页」）：识别语言、用哪个麦克风、换社区的引擎。键是 voice-input.*。

[settings.language]
type = "option"
choices = ["zh", "yue", "en", "ja", "ko", "auto"]
default = "zh"
layers = ["system"]
applies = "now"
name = { en = "Language", zh = "识别语言", ja = "認識する言語" }
description = { en = "zh: Mandarin, yue: Cantonese. auto guesses, and sometimes takes Mandarin for Japanese.", zh = "zh 普通话，yue 粤语。auto 自己猜，会把普通话猜成日语。", ja = "zh は標準中国語、yue は広東語。auto は推測しますが、標準中国語を日本語と間違えることがあります。" }

[settings.microphone]
type = "text"
max = 200
# 配置页画成下拉：选项问这个包的 microphones 方法（核心 SG-2；调不到的头退回文字框）。
choices_from = "microphones"
layers = ["system"]
applies = "now"
name = { en = "Microphone", zh = "麦克风", ja = "マイク" }
description = { en = "The device name. Empty: the system default.", zh = "设备名。不填用系统默认的。", ja = "デバイス名。空欄はシステムの既定。" }

[settings.chime]
type = "bool"
default = true
layers = ["system"]
applies = "now"
name = { en = "Voice input sounds", zh = "语音输入提示音", ja = "音声入力の効果音" }
description = { en = "A rising tone when it starts listening, a falling one when it stops.", zh = "开始听时响一声上扬的，停止听时响一声下沉的。", ja = "聞き始めに上がる音、止めるときに下がる音を鳴らします。" }

[settings.engine]
type = "text"
max = 100
choices_from = "engines"
layers = ["system"]
applies = "now"
name = { en = "Engine", zh = "引擎", ja = "エンジン" }
description = { en = "SenseVoice on this computer (downloads a 163 MB model the first time), or an installed package that plugs into stt.engine, such as deepseek (no model download).", zh = "本机的 SenseVoice（第一次用要下 163 MB 的模型），或者装着的、接进 stt.engine 的包，例如 deepseek（不用下模型）。", ja = "このコンピューターの SenseVoice（初回に 163 MB のモデルをダウンロード）、または stt.engine に接続するインストール済みパッケージ（deepseek など、ダウンロード不要）。" }
