# 朗读（设计见核心仓库 docs/designs/20-语音.md 第六节）。这个包用云端合成（MiniMax、MiMo、OpenAI 兼容）在总线上提供 tts；
# 朗读按钮、自动朗读、语音助手和 AI 的 say 工具都通过它发声。

[package]
version = "0.1.2"
# 最低要求的 Miyu 版本。旧版本的核心读到这一行，会先提示需要更新 Miyu，而不是报告不认识的设置写法。
miyu = "2026.11.0-rc.2.4"
targets = ["linux-x86_64", "macos-aarch64", "windows-x86_64"]
protocol = [1, 1]
name = { en = "Say", zh = "朗读", ja = "読み上げ" }
summary = { en = "Reads replies aloud with a cloud voice; the AI can also speak and send voice messages", zh = "用云端的语音合成把回复念出来，AI 也可以说话和发送语音消息", ja = "クラウドの声で返信を読み上げます。AI が話したり音声メッセージを送ったりできます" }
upstream = "https://github.com/miyu-agent/miyu-voice"
icon = "volume-2"
# 配置键是 say.*（同包编号，写明了不随编号变）。
prefix = "say"

# miyu say <文字>：用当前人格的声音从本机音箱念；-o 存成文件；--file 放一个现成的音频（设计 20 第六节）。
[command]
name = "say"
program = "miyu-say"
about = { en = "Read text aloud", zh = "把文字念出来", ja = "文字を読み上げる" }

[process]
args = ["serve"]
start = "always"
# tools：say 工具；audio.play：从本机音箱放；network：调云端合成；packages.call：调社区的 tts.engine。永远不要麦克风。
capabilities = ["tools", "audio.play", "network", "packages.call"]

# 总线（设计 67）：选的引擎配好了才登记（设计 20 第三节「登记了才算可用」）。
[export]
provides = ["tts"]
methods = ["tts.synthesize", "tts.play", "tts.stop"]

# 配置页（设计 20 第六节「配置页」）：引擎、地址和 key（secret，另存在密钥文件里）、默认的音色和语速、每个人格的音色。
# 改了就生效：扩展收到推送，换引擎；选的引擎没配好的，tts.* 撤掉登记（头就不画朗读按钮）。

[settings.engine]
# 下拉照这个包的 engines 方法给（核心 SG-2 的 choices_from）：内置的几家（名字在 crates/miyu-say/data/engines.json），后面接着装着的、
# 接进 tts.engine 的包（写包的名字，存包的编号），排在一张列表里，不再先选「社区」再选包（施工 VO-32，项目主人 11-17）。
# 下面各家那几节照它的值 shown_when（核心 SW-1：带 choices_from 的 text 也能指）。
type = "text"
max = 100
choices_from = "engines"
default = "minimax"
layers = ["system"]
applies = "now"
name = { en = "Engine", zh = "引擎", ja = "エンジン" }
description = { en = "Choose the service that turns text into speech: a built-in one, or an installed package that plugs into tts.engine, such as DeepSeek.", zh = "选择由哪个服务把文字念出来：可以是内置的服务，也可以是已安装、接入 tts.engine 的软件包，例如 DeepSeek。", ja = "どのサービスで読み上げるか：内蔵のもの、または tts.engine に接続するインストール済みパッケージ（DeepSeek など）。" }

[settings.voice]
type = "text"
max = 200
layers = ["system"]
applies = "now"
name = { en = "Default voice", zh = "默认音色", ja = "既定の声" }
description = { en = "The engine's voice id. If you leave it empty, the engine's default voice is used.", zh = "引擎的音色编号。不填写时使用引擎的默认音色。", ja = "エンジンの声の ID。空欄はエンジンの既定。" }

[settings.speed]
type = "number"
min = 0
max = 2
step = 0.1
slider = true
default = 1.0
layers = ["system"]
applies = "now"
name = { en = "Speed", zh = "语速", ja = "話す速さ" }
description = { en = "From 0.5 to 2. Not every engine supports changing the speed.", zh = "范围是 0.5 到 2。并不是所有引擎都支持调整语速。", ja = "0.5〜2。対応しないエンジンもあります。" }

[settings.personas]
type = "list"
element = "record"
title = "voice"
layers = ["system"]
applies = "now"
name = { en = "Voices per persona", zh = "每个人格的音色", ja = "ペルソナごとの声" }
description = { en = "Personas that are not listed use the default voice. Clone a real person's voice only with their consent.", zh = "没有列出的人格使用默认音色。克隆真人的声音必须得到本人同意。", ja = "載っていないペルソナは既定の声。実在の人の声の複製は本人の同意が必要です。" }

[settings.personas.fields.persona]
type = "persona"
name = { en = "Persona", zh = "人格", ja = "ペルソナ" }

[settings.personas.fields.voice]
type = "text"
max = 200
name = { en = "Voice id", zh = "音色编号", ja = "声の ID" }

[settings.personas.fields.speed]
type = "number"
min = 0
max = 2
step = 0.1
default = 1.0
name = { en = "Speed", zh = "语速", ja = "話す速さ" }

# 三家引擎各一节，只在「引擎」选了它时画（核心 SG-1；项目主人 2026-11-10：选了 MiMo 还露着 MiniMax 的几项）。
[settings.minimax]
name = { en = "MiniMax", zh = "MiniMax", ja = "MiniMax" }
shown_when = { engine = "minimax" }

[settings.minimax.region]
type = "option"
choices = ["mainland", "international"]
default = "mainland"
layers = ["system"]
applies = "now"
name = { en = "MiniMax region", zh = "MiniMax 地区", ja = "MiniMax の地域" }
description = { en = "mainland: api.minimaxi.com. international: api.minimax.io. Keys don't work across regions.", zh = "mainland 是国内版（api.minimaxi.com），international 是国际版（api.minimax.io）。两个地区的密钥不能通用。", ja = "mainland は中国本土（api.minimaxi.com）、international は国際版（api.minimax.io）。キーは共通ではありません。" }

[settings.minimax.key]
type = "secret"
layers = ["system"]
applies = "now"
name = { en = "MiniMax API key", zh = "MiniMax 的 API 密钥", ja = "MiniMax の API キー" }

[settings.minimax.model]
type = "text"
max = 100
default = "speech-2.8-turbo"
layers = ["system"]
applies = "now"
name = { en = "MiniMax model", zh = "MiniMax 的模型", ja = "MiniMax のモデル" }
description = { en = "speech-2.8-turbo is fast and cheap; speech-2.8-hd sounds better.", zh = "speech-2.8-turbo 速度快、价格低；speech-2.8-hd 音质更好。", ja = "speech-2.8-turbo は速くて安価、speech-2.8-hd は高音質。" }

[settings.mimo]
name = { en = "MiMo (Xiaomi)", zh = "MiMo（小米）", ja = "MiMo（Xiaomi）" }
shown_when = { engine = "mimo" }

[settings.mimo.key]
type = "secret"
layers = ["system"]
applies = "now"
name = { en = "MiMo API key", zh = "MiMo 的 API 密钥", ja = "MiMo の API キー" }

[settings.mimo.model]
type = "text"
max = 100
default = "mimo-v2.5-tts"
layers = ["system"]
applies = "now"
name = { en = "MiMo model", zh = "MiMo 的模型", ja = "MiMo のモデル" }

[settings.openai]
name = { en = "OpenAI-compatible", zh = "OpenAI 兼容", ja = "OpenAI 互換" }
shown_when = { engine = "openai" }

[settings.openai.base_url]
type = "url"
default = "https://api.openai.com/v1"
layers = ["system"]
applies = "now"
name = { en = "Address", zh = "地址", ja = "アドレス" }
description = { en = "Write the address up to /v1. For a local server, for example: http://127.0.0.1:9880/v1.", zh = "地址写到 /v1 为止。如果使用本机服务，可以写成 http://127.0.0.1:9880/v1。", ja = "/v1 まで。ローカルなら例えば http://127.0.0.1:9880/v1。" }

[settings.openai.key]
type = "secret"
layers = ["system"]
applies = "now"
name = { en = "API key", zh = "API 密钥", ja = "API キー" }
description = { en = "Leave it empty if your local server does not need a key.", zh = "如果本机服务不需要密钥，这里留空即可。", ja = "キー不要のローカルサーバーなら空欄。" }

[settings.openai.model]
type = "text"
max = 100
default = "gpt-4o-mini-tts"
layers = ["system"]
applies = "now"
name = { en = "Model", zh = "模型", ja = "モデル" }
