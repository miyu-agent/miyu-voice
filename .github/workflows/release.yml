# 发包（照官方软件源的打包模板，同 miyu-im）：推 `v*` 标签（`v` 加上三份清单里同一个 `version`）时，三个包一种系统各打一个
# `.miyu`，传进这个标签的 Release；官方软件源每天收一次。系统照清单的 `targets`：三台 CI 测过的那三种。
# 每个包都带本仓库的 `LICENSE` 和第三方许可证清单 `THIRD-PARTY-LICENSES.txt`（`cargo xtask notices` 生成）。手动跑（workflow_dispatch，在 `step/**` 上试打）照样编、打包，`.miyu` 放进这一趟的产物，不建 Release。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # 包里：清单、bin/miyu-voice-input。识别模型第一次启动时下载，不进包（设计 20 第五节）。
  input:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    uses: miyu-agent/packages/.github/workflows/pack.yml@main
    permissions:
      contents: write
    with:
      package: voice-input
      folder: dist/voice-input
      target: ${{ matrix.target }}
      runs-on: ${{ matrix.os }}
      build: |
        set -euo pipefail
        rustup toolchain install
        if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libasound2-dev; fi
        tools/sherpa-lib.sh
        cargo build --release --locked -p miyu-voice-input --bin miyu-voice-input
        exe=""
        if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
        rm -rf dist/voice-input && mkdir -p dist/voice-input/bin
        cp package/voice-input/package.toml dist/voice-input/
        cp "target/release/miyu-voice-input$exe" dist/voice-input/bin/
        cp LICENSE THIRD-PARTY-LICENSES.txt dist/voice-input/
        for need in package.toml THIRD-PARTY-LICENSES.txt "bin/miyu-voice-input$exe" LICENSE; do
          [ -f "dist/voice-input/$need" ] || { echo "包里少了 voice-input/$need"; exit 1; }
        done

  # 包里：清单、bin/miyu-say。
  say:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    uses: miyu-agent/packages/.github/workflows/pack.yml@main
    permissions:
      contents: write
    with:
      package: say
      folder: dist/say
      target: ${{ matrix.target }}
      runs-on: ${{ matrix.os }}
      build: |
        set -euo pipefail
        rustup toolchain install
        if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libasound2-dev; fi
        tools/sherpa-lib.sh
        cargo build --release --locked -p miyu-say --bin miyu-say
        exe=""
        if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
        rm -rf dist/say && mkdir -p dist/say/bin
        cp package/say/package.toml dist/say/
        cp "target/release/miyu-say$exe" dist/say/bin/
        cp LICENSE THIRD-PARTY-LICENSES.txt dist/say/
        for need in package.toml THIRD-PARTY-LICENSES.txt "bin/miyu-say$exe" LICENSE; do
          [ -f "dist/say/$need" ] || { echo "包里少了 say/$need"; exit 1; }
        done

  # 包里：清单、bin/miyu-voice-assistant。唤醒词、人声检测的模型第一次启动时下载（施工 VO-11 定）。
  assistant:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    uses: miyu-agent/packages/.github/workflows/pack.yml@main
    permissions:
      contents: write
    with:
      package: voice-assistant
      folder: dist/voice-assistant
      target: ${{ matrix.target }}
      runs-on: ${{ matrix.os }}
      build: |
        set -euo pipefail
        rustup toolchain install
        if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libasound2-dev; fi
        tools/sherpa-lib.sh
        cargo build --release --locked -p miyu-voice-assistant --bin miyu-voice-assistant
        exe=""
        if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
        rm -rf dist/voice-assistant && mkdir -p dist/voice-assistant/bin
        cp package/voice-assistant/package.toml dist/voice-assistant/
        cp "target/release/miyu-voice-assistant$exe" dist/voice-assistant/bin/
        cp LICENSE THIRD-PARTY-LICENSES.txt dist/voice-assistant/
        for need in package.toml THIRD-PARTY-LICENSES.txt "bin/miyu-voice-assistant$exe" LICENSE; do
          [ -f "dist/voice-assistant/$need" ] || { echo "包里少了 voice-assistant/$need"; exit 1; }
        done
