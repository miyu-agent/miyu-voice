[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
# 开发包（miyu-sdk 的 Rust 版）：握手、一行一条的收发、几个调用同时来、方法的时限和错误码、等模型下好再登记。只走协议，
# 不依赖核心的 crate（AGENTS.md 第 1 条）。钉一个提交，升级改这里、刷 Cargo.lock。
miyu-ext = { git = "https://github.com/miyu-agent/miyu-sdk", rev = "e20689bb74251bc731ec6205cbcd3ecaf2e39821" }
serde_json = "1"
voice-common = { path = "crates/voice-common" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
