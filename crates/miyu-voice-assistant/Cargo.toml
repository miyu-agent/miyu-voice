[package]
name = "miyu-voice-assistant"
description = "语音助手（设计 20 第九节）：常驻后台，叫名字就能说，命令 miyu listen。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "miyu-voice-assistant"
path = "src/main.rs"

[dependencies]
# 人声检测（Silero VAD）、唤醒词（KWS）：sherpa-onnx，同语音输入那一版，库照 tools/sherpa-lib.sh 校验过的。
sherpa-onnx = "=2.0.1"
# 回声消除（施工 VO-20）：WebRTC AEC3 的纯 Rust 移植，三个系统都不带 C 库。
sonora = "=0.3.0"
# 唤醒词里的汉字注带调拼音（keywords.rs，同旧版）。
pinyin = "0.11.0"
# 系统通知（notify.rs，施工 VO-16）：Linux 是会话 D-Bus 上的 freedesktop 通知（zbus，纯 Rust），macOS、Windows 是系统的；
# 同托盘程序 miyu-applet 钉的那一版。
notify-rust = "=4.18.2"
# 人格头像（persona.avatar 交的是 base64，存成文件给通知用）。
base64 = "0.22"
miyu-ext.workspace = true
serde_json.workspace = true
voice-common = { workspace = true, features = ["mic", "speaker"] }

[lints]
workspace = true
