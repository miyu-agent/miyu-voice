[package]
name = "voice-common"
description = "三个语音包共用的：整机的麦克风锁、音频解码重采样、可念的文字（设计 20）。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# 打开麦克风（mic.rs）：听写、助手要；朗读不要。
mic = ["dep:cpal"]
# 从本机音箱放（speaker.rs）：朗读、助手要；听写不要。
speaker = ["dep:rodio"]

[dependencies]
cpal = { version = "0.18.2", optional = true }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "wav"], optional = true }
# wav 的读写（纯 Rust）：stt.transcribe 收 wav（设计 20 第三节「形状」）。
hound = "3.5.1"
# Markdown 转成念得出来的话（设计 20 第四节）：同 miyu-render 用的那一版，不要它的 HTML 输出。
pulldown-cmark = { version = "0.13.5", default-features = false }
# 转写用词是数据（data/speakable.json，设计 20 第四节「转写规则是数据」）。
serde_json = "1"
# 经核心存、读 blob（blobs.rs）。
miyu-ext.workspace = true
base64 = "0.22"
# 下模型（download.rs）：纯 Rust 的 HTTPS（rustls），走系统代理；压缩包是 .tar.bz2，bzip2 默认用纯 Rust 的 libbz2-rs-sys。
ureq = "3.5.1"
bzip2 = "0.6.1"
tar = { version = "0.4.46", default-features = false }
sha2 = "0.11"

[lints]
workspace = true
