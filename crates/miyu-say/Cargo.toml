[package]
name = "miyu-say"
description = "朗读（设计 20 第六节）：云端合成，在总线上提供 tts、say 工具、miyu say。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "miyu-say"
path = "src/main.rs"

[dependencies]
# 连云端合成（设计 20 第六节）：纯 Rust 的 HTTPS，走系统代理。
ureq = "3.5.1"
# MiniMax 的音频是十六进制，MiMo 的是 base64。
hex = "0.4.3"
base64 = "0.22"
# say 工具存的文件名用内容哈希。
sha2 = "0.11"
miyu-ext.workspace = true
serde_json.workspace = true
voice-common = { workspace = true, features = ["speaker"] }

[lints]
workspace = true
