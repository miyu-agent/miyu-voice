[package]
name = "miyu-voice-input"
description = "语音输入（设计 20 第五节）：本机识别，在总线上提供 stt。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "miyu-voice-input"
path = "src/main.rs"

[dependencies]
# 本机识别（设计 20 第五节）：sherpa-onnx 官方的 Rust 绑定（k2-fsa，Apache-2.0），静态链进程序。它的 build.rs 编译时去
# GitHub Release 下预编译库、不验校验和；CI 和发包照 tools/sherpa-lib.sh 先下、对照钉死的 SHA-256 校验，再用
# SHERPA_ONNX_LIB_DIR 指过去。
sherpa-onnx = "=2.0.1"
# 主进程交给识别子进程的音频（wav）写成 base64 放进一行 JSON。
base64 = "0.22"
miyu-ext.workspace = true
serde_json.workspace = true
voice-common = { workspace = true, features = ["mic", "speaker"] }

[lints]
workspace = true
